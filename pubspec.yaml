name: home_workout
description: A weekly home exercise planner and progress tracker.
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.13.7
dependencies:
  flutter:
    sdk: flutter
  intl: ^0.20.2
  shared_preferences: ^2.5.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/logo.png
  adaptive_icon_background: "#000000"
  remove_alpha_ios: true
